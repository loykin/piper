# Piper single-node configuration and option reference.
# Run from the project root: ./bin/piper server
version: 4

log:
  format: text # text | json
  level: info  # debug | info | warn | error

# Artifact storage defaults to the built-in file store under server.data_dir.
# For distributed direct-runtime execution (K8s pods, Docker containers), an
# S3-compatible URL is recommended. Secrets should come from PIPER_STORAGE_TOKEN
# or the credential referenced by credentialRef.
# storage:
#   disabled: false
#   url: "s3://bucket?region=us-east-1"
#   token: ""
#   credentialRef: ""

# Optional Git credentials used when fetching private pipeline sources.
# Prefer PIPER_SOURCE_GIT_USER and PIPER_SOURCE_GIT_TOKEN.
# source:
#   git:
#     user: ""
#     token: ""

server:
  # HTTP API and UI.
  http_addr: ":8080"

  # Persistent database, artifacts, and generated keys.
  data_dir: ./piper-data

  # Omit both keys to generate them on first startup. Piper stores them in
  # ./piper-data/.server-secrets.yaml with owner-only permissions and reuses
  # them after restart. Back up that file together with the database.
  # auth_signing_key: ""
  # secret_encryption_key: ""

  # Optional shared secret required on the built-in /store HTTP endpoint —
  # relevant when runtime.workload_url points K8s pods or Docker containers
  # back at Piper's own file-based artifact store.
  # worker_token: ""

  # Enable when Piper terminates TLS itself. When TLS terminates at an ingress
  # or reverse proxy, leave this disabled.
  # tls:
  #   enabled: false
  #   cert_file: ./certs/server.crt
  #   key_file: ./certs/server.key

  # SQLite is appropriate for a single server replica.
  db:
    driver: sqlite
    path: ./piper-data/piper.db
    # PostgreSQL alternative:
    # driver: postgres
    # dsn: "host=localhost port=5432 dbname=piper user=piper sslmode=require"

  # Optional cleanup. Zero disables the corresponding cleanup.
  # retention:
  #   run_ttl: 0s
  #   artifact_ttl: 0s

  # Schedule recovery after downtime.
  # schedule:
  #   misfire_policy: run_once # run_once | skip
  #   misfire_grace_period: 5m

  # serving:
  #   model_dir: ./piper-data/models

# runtime.type is required — Piper always owns pipeline/notebook/serving
# execution directly, in-process. Pick exactly one.
runtime:
  type: baremetal
  baremetal:
    meta_dir: ./piper-data/pipeline-meta
    concurrency: 4

# Docker alternative — containers run directly on the Piper host.
# runtime:
#   type: docker
#   docker:
#     network: bridge
#     concurrency: 4
#     # Required with the built-in file store; containers use this private URL.
#     workload_url: http://host.docker.internal:8080

# Kubernetes alternative — Pipeline runs as Jobs, Notebook as
# StatefulSets, Serving as Deployments, all in the configured namespaces.
# runtime:
#   type: k8s
#   namespaces: [piper]
#   kubeconfig: "" # required only outside the cluster
#   in_cluster: true
#   # Required with the built-in file store; pods use this private URL.
#   workload_url: http://piper-server.piper.svc.cluster.local:8080
#   pipeline_runner:
#     image: ghcr.io/loykin/piper:latest
#     image_pull_policy: IfNotPresent

# Notebook workspace layout — only meaningful when runtime.type is docker or
# baremetal (K8s notebooks use a PVC and a fixed in-pod port instead).
notebook:
  notebooks_root: ./notebooks
  port_range: 8888-9900

# Federation is optional. With no deployment block, this remains a standalone
# Home whose projects execute on its in-process Local Member.
#
# Home example — tunnel TLS reuses server.tls when enabled. Projects omitted
# from home.projects execute locally; mapped projects route Run-domain calls
# to the named enrolled Member.
# deployment:
#   mode: home
# home:
#   id: home-prod
#   tunnel_addr: ":9090"
#   members:
#     member-gpu: "replace-with-a-distinct-secret"
#   projects:
#     image-training: member-gpu
#
# Member example — exposes no HTTP/UI and dials Home outbound. Use https in
# production when the Home tunnel is configured with server.tls.
# deployment:
#   mode: member
#   member_id: member-gpu
# home:
#   id: home-prod
#   url: https://home.example.com:9090
#   enrollment_token: "replace-with-the-same-member-secret"
