services:
  piper:
    image: ${PIPER_IMAGE:-ghcr.io/loykin/piper:latest}
    command: ["--config=/etc/piper/piper.yaml", "server"]
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PIPER_PORT:-8080}:8080"
    volumes:
      - ./docker/piper.yaml:/etc/piper/piper.yaml:ro
      - piper-data:/var/lib/piper
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  piper-data:
