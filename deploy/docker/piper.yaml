# Single-node Docker deployment. Secrets are generated in /var/lib/piper and
# persist in the piper-data volume.
version: 4

log:
  format: json
  level: info

server:
  http_addr: ":8080"
  data_dir: /var/lib/piper
  db:
    driver: sqlite
    path: /var/lib/piper/piper.db

# Pipeline/Notebook execution runs directly inside this container as
# subprocesses — no worker tunnel involved.
runtime:
  type: baremetal
  baremetal:
    meta_dir: /var/lib/piper/pipeline-meta
    concurrency: 4

notebook:
  notebooks_root: /var/lib/piper/notebooks
  port_range: 8888-9900
