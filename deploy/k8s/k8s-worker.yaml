# Kubernetes-native worker. Deploy with server.yaml and rbac.yaml when Piper
# should execute pipeline steps as Jobs and manage notebook/serving workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper-k8s-worker
  namespace: piper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: piper-k8s-worker
  template:
    metadata:
      labels:
        app: piper-k8s-worker
    spec:
      serviceAccountName: piper
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/loykin/piper:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - --config=/etc/piper/piper.yaml
            - worker
          env:
            - name: PIPER_WORKER_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: piper-server-secrets
                  key: worker_token
          volumeMounts:
            - name: config
              mountPath: /etc/piper
              readOnly: true
            - name: worker-state
              mountPath: /var/lib/piper
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: piper-config
        - name: worker-state
          persistentVolumeClaim:
            claimName: piper-k8s-worker-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-k8s-worker-state
  namespace: piper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
