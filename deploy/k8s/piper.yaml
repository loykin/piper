version: 4

log:
  format: json
  level: info

server:
  http_addr: ":8080"
  data_dir: /var/lib/piper
  db:
    driver: sqlite
    path: /var/lib/piper/piper.db

# Pipeline Jobs, Notebook StatefulSets, and Serving Deployments are all
# launched directly by the Piper server through the in-cluster Kubernetes
# API — no worker tunnel involved. workload_url is used only when the
# built-in file-backed artifact store must be exposed privately to pods.
runtime:
  type: k8s
  namespaces:
    - piper
  in_cluster: true
  workload_url: http://piper-server.piper.svc.cluster.local:8080
  pipeline_runner:
    image: ghcr.io/loykin/piper:latest
    image_pull_policy: IfNotPresent
