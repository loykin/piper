# Create the real Secret without committing key material:
# kubectl -n piper create secret generic piper-server-secrets \
#   --from-literal=auth_signing_key="$(openssl rand -hex 32)" \
#   --from-literal=secret_encryption_key="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: piper-server-secrets
  namespace: piper
type: Opaque
stringData:
  auth_signing_key: replace-me
  secret_encryption_key: replace-me
