apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper-server
  namespace: piper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piper-server
  template:
    metadata:
      labels:
        app: piper-server
    spec:
      serviceAccountName: piper
      containers:
        - name: piper
          image: piper/piper:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --addr=:8080
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PIPER_SERVER_ADDR
              value: :8080
            - name: PIPER_SERVER_DATA_DIR
              value: /var/lib/piper
            - name: PIPER_SERVER_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: piper-server-secrets
                  key: auth_signing_key
            - name: PIPER_SERVER_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: piper-server-secrets
                  key: secret_encryption_key
            # Artifact storage is configured once here, on the master — workers
            # never need their own copy; storage.url and storage.token are
            # forwarded to workers per-task over the existing tunnel (see
            # AGENTS.md's "Worker Network Invariant"; storage.url is the one
            # documented exception, allowing workers to connect directly to
            # the object store for the actual data transfer).
            - name: PIPER_STORAGE_URL
              valueFrom:
                secretKeyRef:
                  name: piper-storage
                  key: url
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/piper
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: piper-server-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-server-data
  namespace: piper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: piper-server
  namespace: piper
spec:
  selector:
    app: piper-server
  ports:
    - name: http
      port: 8080
      targetPort: http
