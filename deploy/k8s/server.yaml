apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper-server
  namespace: piper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: piper-server
  template:
    metadata:
      labels:
        app: piper-server
    spec:
      serviceAccountName: piper
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: piper
          image: ghcr.io/loykin/piper:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - --config=/etc/piper/piper.yaml
            - server
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PIPER_SERVER_AUTH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: piper-server-secrets
                  key: auth_signing_key
            - name: PIPER_SERVER_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: piper-server-secrets
                  key: secret_encryption_key
            - name: PIPER_SERVER_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: piper-server-secrets
                  key: worker_token
            # Artifact storage is configured once here, on the master — workers
            # never need their own copy; storage.url and storage.token are
            # forwarded to workers per-task over the existing tunnel (see
            # AGENTS.md's "Worker Network Invariant"; storage.url is the one
            # documented exception, allowing workers to connect directly to
            # the object store for the actual data transfer).
            - name: PIPER_STORAGE_URL
              valueFrom:
                secretKeyRef:
                  name: piper-storage
                  key: url
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/piper
              readOnly: true
            - name: data
              mountPath: /var/lib/piper
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: piper-config
        - name: data
          persistentVolumeClaim:
            claimName: piper-server-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-server-data
  namespace: piper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: piper-server
  namespace: piper
spec:
  selector:
    app: piper-server
  ports:
    - name: http
      port: 8080
      targetPort: http
