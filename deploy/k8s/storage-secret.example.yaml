# Copy to storage-secret.yaml, fill in real values, and apply before server.yaml.
#
# `url` is the only key piper-server actually reads (mapped to storage.url via
# PIPER_STORAGE_URL in server.yaml) — see pkg/storage/s3store.go for the full
# query-parameter format: s3://bucket?region=…&endpoint=…&s3ForcePathStyle=…
# &accessKey=…&secretKey=…
#
# access_key/secret_key/bucket are kept as separate keys only so
# seaweedfs.yaml's bucket-setup Job can reuse them without re-parsing `url` —
# if you point this at your own S3-compatible provider instead of the bundled
# SeaweedFS deployment, keep all four keys in sync by hand and skip
# seaweedfs.yaml entirely.
apiVersion: v1
kind: Secret
metadata:
  name: piper-storage
  namespace: piper
type: Opaque
stringData:
  access_key: anyadmin
  secret_key: anypassword
  bucket: piper-artifacts
  # Default endpoint is the bundled piper-seaweedfs Service (see seaweedfs.yaml).
  # Point this at your own provider instead (e.g. AWS S3: drop s3ForcePathStyle
  # and endpoint, keep region) and skip seaweedfs.yaml if you already have one.
  url: "s3://piper-artifacts?region=us-east-1&endpoint=http://piper-seaweedfs.piper.svc.cluster.local:8333&s3ForcePathStyle=true&accessKey=anyadmin&secretKey=anypassword"
