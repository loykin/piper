# Bare-metal worker example. Use this only when the container or host provides
# the commands and runtimes required by submitted pipeline steps. A Kubernetes
# deployment that executes steps as Jobs should use k8s-worker.yaml instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper-worker
  namespace: piper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piper-worker
  template:
    metadata:
      labels:
        app: piper-worker
    spec:
      serviceAccountName: piper
      containers:
        - name: worker
          image: piper/piper:latest
          imagePullPolicy: IfNotPresent
          args:
            - worker
            - --master-url=http://piper-server.piper.svc.cluster.local:8080
            - --concurrency=2
            - --infrastructure=baremetal
          # No storage env here: artifact storage is configured once on the
          # master (see server.yaml) and forwarded to this worker per-task
          # over the existing tunnel.
