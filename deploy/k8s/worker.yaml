# Bare-metal worker example. Use this only when the container or host provides
# the commands and runtimes required by submitted pipeline steps. A Kubernetes
# deployment that executes steps as Jobs should use k8s-worker.yaml instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper-worker
  namespace: piper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piper-worker
  template:
    metadata:
      labels:
        app: piper-worker
    spec:
      serviceAccountName: piper
      containers:
        - name: worker
          image: piper/piper:latest
          imagePullPolicy: IfNotPresent
          args:
            - worker
            - --master-url=http://piper-server.piper.svc.cluster.local:8080
            - --concurrency=2
            - --infrastructure=baremetal
          env:
            - name: PIPER_SOURCE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: piper-s3
                  key: endpoint
                  optional: true
            - name: PIPER_SOURCE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: piper-s3
                  key: access_key
                  optional: true
            - name: PIPER_SOURCE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: piper-s3
                  key: secret_key
                  optional: true
            - name: PIPER_SOURCE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: piper-s3
                  key: bucket
                  optional: true
