openapi: 3.1.0
info:
  title: piper API
  version: 0.1.0
  description: |
    Project-owned resources are always exposed below `/api/projects/{project_id}`.
    Collection POST operations return `201 Created`, successful mutations with no
    response body return `204 No Content`, JSON field names use snake_case, and
    errors use the shape `{"error":"message"}`.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Server health.
  /events:
    get:
      responses:
        "200":
          description: Server-sent event stream for run, step, schedule, and service events.
          content:
            text/event-stream:
              schema:
                type: string
  /api/projects/{project_id}/credentials:
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Project credential metadata. Secret values are never returned.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }
    post:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCredentialRequest" }
      responses:
        "201":
          description: Created credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "409":
          description: Credential already exists.
  /api/projects/{project_id}/credentials/{name}:
    get:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CredentialName"
      responses:
        "200":
          description: Project credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "404":
          description: Credential not found.
    patch:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CredentialName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchCredentialRequest" }
      responses:
        "200":
          description: Credential metadata updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "404":
          description: Credential not found.
    delete:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CredentialName"
      responses:
        "204":
          description: Credential deleted.
        "404":
          description: Credential not found.
  /api/projects/{project_id}/credentials/{name}/rotate:
    post:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CredentialName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateCredentialRequest" }
      responses:
        "204":
          description: Credential value rotated.
        "404":
          description: Credential not found.
        "409":
          description: Credential is disabled.
  /api/projects/{project_id}/credentials/{name}/test:
    post:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CredentialName"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestCredentialRequest" }
      responses:
        "200":
          description: Credential test succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCredentialResult" }
        "502":
          description: Credential test failed.
  /api/projects/{project_id}/mlflow-integrations:
    get:
      summary: List MLflow tracking integrations (docs/mlflow-tracking-adapter.md section 11.1).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/ProjectID"
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Project MLflow integrations. Credential values are never returned — only credential_ref, a name reference into /credentials.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MlflowIntegrationDetail" }
    post:
      summary: Create an MLflow tracking integration. Requires project admin.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrUpdateMlflowIntegrationRequest" }
      responses:
        "201":
          description: Created MLflow integration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MlflowIntegration" }
        "400": { description: Invalid tracking_uri, artifact_mode, or other field. }
        "403": { description: Project admin role required. }
        "409": { description: An integration with this name already exists. }
  /api/projects/{project_id}/mlflow-integrations/{id}:
    get:
      summary: Get an MLflow integration with its health/backlog snapshot.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/MlflowIntegrationID"
      responses:
        "200":
          description: MLflow integration detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MlflowIntegrationDetail" }
        "404": { description: Integration not found. }
    put:
      summary: Replace an MLflow integration's configuration. Requires project admin.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/MlflowIntegrationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrUpdateMlflowIntegrationRequest" }
      responses:
        "200":
          description: Updated MLflow integration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MlflowIntegration" }
        "400": { description: Invalid tracking_uri, artifact_mode, or other field. }
        "403": { description: Project admin role required. }
        "404": { description: Integration not found. }
        "409": { description: Another integration already uses this name. }
    delete:
      summary: |
        Delete (soft-delete) an MLflow integration. Requires project admin.
        Stops the dispatcher for this integration, preserves pending outbox
        events as `disabled` rather than losing them, preserves the
        experiment/run mapping history, and never deletes anything on the
        remote MLflow server (docs/mlflow-tracking-adapter.md section 11.1).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/MlflowIntegrationID"
      responses:
        "204": { description: Integration deleted. }
        "403": { description: Project admin role required. }
        "404": { description: Integration not found. }
  /api/projects/{project_id}/mlflow-integrations/{id}/test:
    post:
      summary: |
        Test connectivity to the integration's TrackingURI. Performs a single
        bounded experiment lookup — never creates an experiment or run.
        Requires project admin.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/MlflowIntegrationID"
      responses:
        "200":
          description: Connection test result (ok may be false — the request itself still succeeded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MlflowConnectionTestResult" }
        "403": { description: Project admin role required. }
        "404": { description: Integration not found. }
  /api/projects/{project_id}/runs/{id}/mlflow-links:
    get:
      summary: MLflow sync status and UI link(s) for a pipeline run (docs/mlflow-tracking-adapter.md section 11.2).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: |
            MLflow run links for this run, one per integration it has been
            exported to (in practice at most one — v1 allows only a single
            default integration per project). Never includes an MLflow API
            credential or raw artifact URI.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MlflowRunLink" }
  /api/projects/{project_id}/alert-rules:
    get:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Project alert rules.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
    post:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAlertRuleRequest" }
      responses:
        "201":
          description: Alert rule created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { description: Invalid condition, cooldown, or notification credential. }
        "409": { description: Rule name already exists. }
  /api/projects/{project_id}/alert-rules/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AlertRuleID"
      responses:
        "200":
          description: Alert rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "404": { description: Alert rule not found. }
    patch:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AlertRuleID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchAlertRuleRequest" }
      responses:
        "200":
          description: Alert rule updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { description: Invalid rule. }
        "404": { description: Alert rule not found. }
        "409": { description: Rule name already exists. }
    delete:
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/AlertRuleID"
      responses:
        "204": { description: Alert rule deleted. }
        "404": { description: Alert rule not found. }
  /api/projects/{project_id}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema: { type: string }
        - name: pipeline_name
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Runs. Step summaries are included only when include_steps=true.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunWithSteps" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
                params: { type: object, additionalProperties: true }
                experiment: { type: string }
                vars: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created run id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
  /api/projects/{project_id}/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/Step" }
  /api/projects/{project_id}/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run canceled.
  /api/projects/{project_id}/runs/{id}/rerun:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "201":
          description: Replacement run created.
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id: { type: string }
  /api/projects/{project_id}/runs/{id}/steps/{step}/retry:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: step
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Retry run created.
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id: { type: string }
  /api/projects/{project_id}/runs/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Artifact tree.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StepArtifacts" }
  /api/projects/{project_id}/runs/{id}/steps/{step}/logs:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: step
          in: path
          required: true
          schema: { type: string }
        - name: after_id
          in: query
          deprecated: true
          schema: { type: integer, format: int64 }
        - name: cursor
          in: query
          description: Opaque cursor returned by X-Next-Cursor.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: search
          in: query
          description: Available only when the project Member advertises full_text_search.
          schema: { type: string }
      responses:
        "200":
          description: Step logs.
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page; absent on the final page.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogLine" }
  /api/projects/{project_id}/runs/{id}/steps/{step}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: step
          in: path
          required: true
          schema: { type: string }
        - name: after_id
          in: query
          description: Resume after this log ID when Last-Event-ID is not present.
          schema: { type: integer, format: int64 }
        - name: Last-Event-ID
          in: header
          description: Opaque SSE resume cursor sent automatically by EventSource.
          schema: { type: string }
      responses:
        "200":
          description: >-
            Server-sent step log stream. Default messages contain LogLine JSON;
            each log frame has an SSE id for automatic resume;
            done marks normal completion; stats_error contains
            {code,message,retryable} JSON for statistics backend failures.
          content:
            text/event-stream:
              schema: { type: string }
  /api/projects/{project_id}/stats/capabilities:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      responses:
        "200":
          description: Statistics features exposed by the Member that owns this project.
          content:
            application/json:
              schema:
                type: object
                required: [full_text_search, time_range, metric_key_filter, healthy, degraded, pending_bytes]
                properties:
                  full_text_search: { type: boolean }
                  time_range: { type: boolean }
                  metric_key_filter: { type: boolean }
                  healthy: { type: boolean }
                  degraded: { type: boolean }
                  pending_bytes: { type: integer, format: int64, minimum: 0 }
                  last_error: { type: string }
  /api/projects/{project_id}/runs/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: step
          in: query
          schema: { type: string }
        - name: key
          in: query
          description: Repeat to select multiple metric keys.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Run metrics.
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page; absent on the final page.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/projects/{project_id}/schedules:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Schedules.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, yaml, type]
              properties:
                name: { type: string }
                yaml: { type: string }
                type: { type: string, enum: [immediate, once, cron] }
                cron: { type: string }
                run_at: { type: string, format: date-time }
                params: { type: object, additionalProperties: true }
                max_runs: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Created schedule id.
          content:
            application/json:
              schema:
                type: object
                required: [schedule_id]
                properties:
                  schedule_id: { type: string }
  /api/projects/{project_id}/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "200":
          description: Schedule detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
    patch:
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Enabled flag updated.
    delete:
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "204":
          description: Deleted.
  /api/projects/{project_id}/schedules/{id}/backfill:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        "201":
          description: Backfill runs created.
          content:
            application/json:
              schema:
                type: object
                required: [run_ids]
                properties:
                  run_ids:
                    type: array
                    items: { type: string }
  /api/projects/{project_id}/pipeline-templates:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Versioned pipeline templates.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineTemplate" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
                volume_id: { type: string }
      responses:
        "201":
          description: Pipeline template version created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineTemplate" }
  /api/projects/{project_id}/pipeline-templates/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      responses:
        "200":
          description: Pipeline template version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineTemplate" }
    delete:
      responses:
        "204": { description: Pipeline template version deleted. }
  /api/projects/{project_id}/notebooks:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Notebook servers.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookServer" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
                volume_id: { type: string }
      responses:
        "201":
          description: Notebook server created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookServer" }
  /api/projects/{project_id}/notebooks/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      responses:
        "200":
          description: Notebook server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookServer" }
    delete:
      responses:
        "204": { description: Notebook server deleted and volume released. }
  /api/projects/{project_id}/notebooks/{name}/start:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204": { description: Notebook start requested. }
  /api/projects/{project_id}/notebooks/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204": { description: Notebook stop requested. }
  /api/projects/{project_id}/notebooks/{name}/contents:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: false
        schema: { type: string }
    get:
      responses:
        "200":
          description: Directory listing (or a single file's metadata) under the notebook's workspace.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookContentEntry" }
  /api/projects/{project_id}/notebooks/{name}/documents:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string, description: "Must end in .ipynb." }
    get:
      responses:
        "200":
          description: Notebook document and its content hash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookDocument" }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: object, description: "Full .ipynb JSON document." }
                base_hash:
                  type: string
                  description: >-
                    Content hash the caller last read. If set and the document already
                    exists with a different current hash, the write is rejected with
                    content_conflict instead of silently overwriting a concurrent edit.
      responses:
        "204": { description: Notebook document created or replaced. }
  /api/projects/{project_id}/notebooks/{name}/kernel-sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      responses:
        "200":
          description: Kernel sessions (own sessions for member; all sessions for admin).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KernelSession" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: "Target .ipynb path the session is bound to." }
                kernel_name: { type: string, description: "Defaults to python3." }
      responses:
        "201":
          description: Kernel session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KernelSession" }
  /api/projects/{project_id}/notebooks/{name}/kernel-sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      responses:
        "200":
          description: Kernel session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KernelSession" }
    delete:
      responses:
        "204": { description: Kernel session closed. }
  /api/projects/{project_id}/notebooks/{name}/kernel-sessions/{id}/interrupt:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204": { description: Interrupt sent to the kernel. }
  /api/projects/{project_id}/notebooks/{name}/kernel-sessions/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204": { description: Kernel restarted in place. }
  /api/projects/{project_id}/notebook-executions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          schema: { type: integer }
        - name: notebook
          in: query
          required: false
          schema: { type: string }
          description: Optional exact notebook server name filter.
      responses:
        "200":
          description: Project execution history across notebooks, most recently queued first. X-Total-Count is set when limit is provided.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookExecution" }
  /api/projects/{project_id}/notebooks/{name}/executions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookExecutionRequest" }
      responses:
        "201":
          description: Execution created (queued or awaiting_approval, per notebook_execution.mcp_policy).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookExecution" }
        "200":
          description: Idempotency-Key replay — the existing execution for the same request is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookExecution" }
        "409":
          description: Idempotency-Key reused with a different request payload, or a genuine content conflict.
        "429":
          description: notebook_execution concurrency limit reached (max_queued_per_project).
  /api/projects/{project_id}/notebook-executions/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      responses:
        "200":
          description: Execution status, progress, and result location.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookExecution" }
  /api/projects/{project_id}/notebook-executions/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204": { description: Cancellation requested (own execution, or any execution for admin). }
  /api/projects/{project_id}/notebook-executions/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204": { description: awaiting_approval execution approved and queued (admin only). }
  /api/projects/{project_id}/notebook-executions/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204": { description: awaiting_approval execution denied and cancelled (admin only). }
  /api/projects/{project_id}/notebook-execution-policy:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      responses:
        "200":
          description: Effective notebook_execution.mcp_policy for this project (project override, or the system default).
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcp_policy: { type: string, enum: [disabled, approval_required, allowed] }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mcp_policy]
              properties:
                mcp_policy: { type: string, enum: [disabled, approval_required, allowed] }
      responses:
        "204": { description: Project-level policy override set (admin only). }
  /api/projects/{project_id}/services:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Deployed services.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "201":
          description: Deployed service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
  /api/projects/{project_id}/services/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Service detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    delete:
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Stopped and deleted.
  /api/projects/{project_id}/services/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Restarted.
  /api/projects/{project_id}/runs/{id}/artifacts/{step}/{artifact}/view:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/RunID"
      - name: step
        in: path
        required: true
        schema: { type: string }
      - name: artifact
        in: path
        required: true
        schema: { type: string }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string }
      responses:
        "201":
          description: Viewer created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewer" }
        "200":
          description: Existing running viewer returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewer" }
  /api/capabilities:
    get:
      security: []
      responses:
        "200":
          description: Which optional access-control capabilities this server has.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authentication: { type: boolean }
                  login_routes: { type: boolean }
                  login_mode: { type: string }
                  login_url: { type: string }
                  user_directory: { type: boolean }
                  user_management: { type: boolean }
                  project_member_management: { type: boolean }
  /api/auth/bootstrap-status:
    get:
      security: []
      responses:
        "200":
          description: Whether first-run admin setup is still required.
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: { type: boolean }
  /api/auth/bootstrap:
    post:
      security: []
      description: Creates the first system-admin account. Only succeeds while no user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Created admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409":
          description: Setup was already completed.
  /api/auth/login:
    post:
      security: []
      description: Sets the access and refresh session cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          description: Invalid credentials.
  /api/auth/refresh:
    post:
      security: []
      description: Rotates the session using the refresh cookie (or a `refresh_token` JSON body).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Session refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          description: Missing or invalid refresh token.
  /api/auth/logout:
    post:
      responses:
        "204":
          description: Session revoked and cookies cleared.
  /api/auth/me:
    get:
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /api/system/users:
    get:
      description: System admin only.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Users.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      description: System admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - type: object
                  properties:
                    system_admin: { type: boolean }
      responses:
        "201":
          description: Created user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /api/system/users/{id}:
    delete:
      description: System admin only.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Deleted.
  /api/system/users/{id}/memberships:
    get:
      description: System admin only.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: The user's project memberships.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectMember" }
  /api/system/settings:
    get:
      description: System admin only.
      responses:
        "200":
          description: Server capability state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
  /api/system/storage/settings:
    get:
      description: System admin only. Read-only diagnostic; the storage backend is deploy-time configuration.
      responses:
        "200":
          description: Configured and effective artifact storage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_path: { type: string }
                  config: { $ref: "#/components/schemas/StorageConfig" }
                  effective: { $ref: "#/components/schemas/ArtifactStoreSettings" }
                  restart_required: { type: boolean }
  /api/system/storage/settings/test:
    post:
      description: System admin only. Checks a candidate configuration without persisting it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageConfig" }
      responses:
        "200":
          description: Reachability result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
  /api/system/credentials:
    get:
      description: System admin only. System-scoped credentials (e.g. the artifact-storage s3 credential).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Credential metadata. Secret values are never returned.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Credential" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCredentialRequest" }
      responses:
        "201":
          description: Created credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
  /api/system/credentials/{name}:
    parameters:
      - $ref: "#/components/parameters/CredentialName"
    get:
      responses:
        "200":
          description: Credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchCredentialRequest" }
      responses:
        "200":
          description: Updated credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
    delete:
      responses:
        "204":
          description: Deleted.
  /api/system/credentials/{name}/rotate:
    parameters:
      - $ref: "#/components/parameters/CredentialName"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateCredentialRequest" }
      responses:
        "204":
          description: Rotated.
  /api/system/credentials/{name}/test:
    parameters:
      - $ref: "#/components/parameters/CredentialName"
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestCredentialRequest" }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCredentialResult" }
  /api/system/federation/members:
    get:
      description: System admin only. Members enrolled with this Home.
      responses:
        "200":
          description: Federation members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FederationMember" }
  /api/system/federation/audit-events:
    get:
      description: System admin only. Newest first.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Federation audit events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FederationAuditEvent" }
  /api/projects:
    get:
      description: Projects visible to the caller (all projects for a system admin).
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      description: System admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string, pattern: "^[a-z0-9-]+$" }
                name: { type: string }
                description: { type: string }
                owner_member_id: { type: string }
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /api/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    delete:
      description: System admin only. Stops the project's live runs, notebooks, and services before deleting it.
      responses:
        "204":
          description: Deleted.
        "409":
          description: The last remaining project cannot be deleted.
  /api/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Project members.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectMember" }
    post:
      description: Project admin only. Identify the user by `username` (or `user_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                user_id: { type: string }
                username: { type: string }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201":
          description: Added member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
  /api/projects/{project_id}/members/candidates:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      description: Project admin only. Users who are not yet members.
      responses:
        "200":
          description: Candidate usernames.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username: { type: string }
  /api/projects/{project_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    patch:
      description: Project admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
    delete:
      description: Project admin only.
      responses:
        "204":
          description: Removed.
  /api/projects/{project_id}/experiments:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      description: Aggregates of runs grouped by experiment name. Experiments are not a stored resource.
      parameters:
        - name: name
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Experiment summaries.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExperimentSummary" }
    post:
      description: Submits one run per trial under a shared experiment name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml, experiment, runs]
              properties:
                yaml: { type: string }
                experiment: { type: string }
                runs:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      params: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Submitted runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment: { type: string }
                  run_ids:
                    type: array
                    items: { type: string }
  /api/projects/{project_id}/runs/{id}/steps:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Steps of the run.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Step" }
  /api/projects/{project_id}/runs/{id}/artifacts/{path}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      description: Downloads an artifact file. `path` is `{step}/{artifact path...}` and may contain slashes.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File contents.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /api/projects/{project_id}/schedules/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "200":
          description: Runs created by the schedule.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
  /api/projects/{project_id}/pipeline-templates/{id}/run:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                params: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Started run.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
  /api/projects/{project_id}/pipeline-templates/{id}/deploy:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      description: Creates a cron schedule bound to this template version.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron]
              properties:
                cron: { type: string }
                enabled: { type: boolean }
                max_runs: { type: integer, minimum: 0 }
                params: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
  /api/projects/{project_id}/notebooks/history:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Notebook launch history.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookHistory" }
  /api/projects/{project_id}/notebook-volumes:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Notebook volumes.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookVolume" }
  /api/projects/{project_id}/notebook-volumes/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      description: Permanently deletes a released volume and its backing storage.
      responses:
        "204":
          description: Deleted.
  /api/projects/{project_id}/notebook-volumes/{id}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      parameters:
        - name: path
          in: query
          description: Workspace-relative directory.
          schema: { type: string }
        - name: ext
          in: query
          description: Only list files with this extension.
          schema: { type: string }
      responses:
        "200":
          description: Workspace-relative file paths.
          headers:
            X-Piper-Files-Truncated:
              schema: { type: string, enum: ["true", "false"] }
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "409":
          description: The volume's files are not reachable (e.g. no running notebook for a k8s volume).
        "503":
          description: The volume is transitioning; retry after `Retry-After` seconds.
  /api/projects/{project_id}/services/history:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Serving deploy history.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceHistory" }
  /api/projects/{project_id}/storage/objects:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      description: One folder level of the artifact store (S3 delimiter semantics).
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Objects and pseudo-directories.
          headers:
            X-Total-Count: { $ref: "#/components/headers/TotalCount" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StorageObjectInfo" }
        "503":
          description: No artifact store is configured.
    post:
      description: Project member only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                key:
                  type: string
                  description: Object key; defaults to the uploaded file name.
      responses:
        "200":
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
  /api/projects/{project_id}/storage/objects/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: key
        in: path
        required: true
        description: Object key; may contain slashes.
        schema: { type: string }
    get:
      responses:
        "200":
          description: Object contents, served as an attachment.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    delete:
      description: Project member only.
      responses:
        "204":
          description: Deleted.

  /api/projects/{project_id}/viewers:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      responses:
        "200":
          description: Artifact viewers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Viewer" }
  /api/projects/{project_id}/viewers/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      responses:
        "200":
          description: Viewer plus its browser proxy URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Viewer"
                  - type: object
                    properties:
                      url: { type: string }
  /api/projects/{project_id}/viewers/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      responses:
        "204":
          description: Stopped.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    CredentialName:
      name: name
      in: path
      required: true
      schema: { type: string }
    AlertRuleID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunID:
      name: id
      in: path
      required: true
      schema: { type: string }
    ScheduleID:
      name: id
      in: path
      required: true
      schema: { type: string }
    MlflowIntegrationID:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size. When set, the response carries `X-Total-Count`.
      schema: { type: integer, minimum: 1 }
    Offset:
      name: offset
      in: query
      description: Rows to skip; only applies together with `limit`.
      schema: { type: integer, minimum: 0 }
  headers:
    TotalCount:
      description: Total rows matching the filter, ignoring limit/offset. Sent whenever `limit` is.
      schema: { type: integer }
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        system_admin: { type: boolean }
        disabled: { type: boolean }
    SessionUser:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
    ProjectRole:
      type: string
      enum: [viewer, member, admin]
    ProjectMember:
      type: object
      properties:
        project_id: { type: string }
        user_id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner_member_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FederationMember:
      type: object
      properties:
        home_id: { type: string }
        id: { type: string }
        enabled: { type: boolean }
        status: { type: string }
        last_connected_at: { type: [string, "null"], format: date-time }
        last_disconnected_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FederationAuditEvent:
      type: object
      properties:
        id: { type: string }
        home_id: { type: string }
        type: { type: string }
        member_id: { type: string }
        project_id: { type: string }
        actor_id: { type: string }
        detail: { type: string }
        created_at: { type: string, format: date-time }
    ArtifactStoreSettings:
      type: object
      properties:
        status: { type: string, enum: [enabled, disabled, unavailable] }
        backend: { type: string }
        reason: { type: string }
    SystemSettings:
      type: object
      properties:
        artifact_store: { $ref: "#/components/schemas/ArtifactStoreSettings" }
        runtime:
          type: object
          properties:
            type: { type: string, enum: [baremetal, docker, k8s] }
    StorageConfig:
      type: object
      properties:
        url: { type: string }
        disabled: { type: boolean }
        token: { type: string }
        credentialRef: { type: string }
    StorageObjectInfo:
      type: object
      properties:
        key: { type: string }
        size: { type: integer, format: int64 }
        modified_at: { type: string }
        download_url: { type: string }
        is_dir: { type: boolean }
    ExperimentSummary:
      type: object
      properties:
        name: { type: string }
        runs: { type: integer }
        success: { type: integer }
        failed: { type: integer }
        running: { type: integer }
        latest: { type: string }
    NotebookHistory:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: string }
        name: { type: string }
        status: { type: string }
        env: { type: string }
        endpoint: { type: string }
        pid: { type: integer }
        work_dir: { type: string }
        runtime_id: { type: string }
        volume_id: { type: string }
        image: { type: string }
        yaml: { type: string }
        created_by: { type: string }
        deployed_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
    NotebookVolume:
      type: object
      properties:
        project_id: { type: string }
        id: { type: string }
        label: { type: string }
        work_dir: { type: string }
        status: { type: string }
        runtime_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceHistory:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: string }
        name: { type: string }
        run_id: { type: string }
        artifact: { type: string }
        status: { type: string }
        endpoint: { type: string }
        namespace: { type: string }
        pid: { type: integer }
        yaml: { type: string }
        created_by: { type: string }
        deployed_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
    Credential:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [generic, git, s3, gcs, azure, slack, webhook, mlflow] }
        endpoint: { type: string }
        keys:
          type: array
          items: { type: string }
        disabled: { type: boolean }
        last_used_at: { type: string, format: date-time }
        last_tested_at: { type: string, format: date-time }
        last_test_ok: { type: boolean }
        last_test_message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCredentialRequest:
      type: object
      required: [name, kind, data]
      properties:
        name: { type: string }
        kind: { type: string, enum: [generic, git, s3, gcs, azure, slack, webhook, mlflow] }
        endpoint: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
    RotateCredentialRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: { type: string }
    PatchCredentialRequest:
      type: object
      properties:
        enabled: { type: boolean }
        endpoint: { type: string }
    TestCredentialRequest:
      type: object
      properties:
        repo: { type: string }
    TestCredentialResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
    MlflowIntegration:
      type: object
      description: |
        A project-scoped connection to an external MLflow Tracking Server
        (docs/mlflow-tracking-adapter.md section 5.1). credential_ref is a
        name reference into /credentials — the credential value itself is
        never included here.
      required: [id, project_id, name, tracking_uri, credential_ref, enabled, default, export_pipelines, export_notebook_executions, artifact_mode, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        tracking_uri: { type: string, format: uri }
        credential_ref: { type: string }
        enabled: { type: boolean }
        default: { type: boolean }
        export_pipelines: { type: boolean }
        export_notebook_executions: { type: boolean }
        experiment_template: { type: string, description: 'Default: "piper/{project_id}/{experiment_or_pipeline}".' }
        artifact_mode: { type: string, enum: [reference], description: "v1 only supports reference; mirror_selected/mirror_all are reserved for a later phase." }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    CreateOrUpdateMlflowIntegrationRequest:
      type: object
      required: [name, tracking_uri, credential_ref]
      properties:
        name: { type: string }
        tracking_uri: { type: string, format: uri, description: "Must be https (http only via a system-level development override); no userinfo/credentials; no private, loopback, or link-local address." }
        credential_ref: { type: string, description: "Name of an existing mlflow-kind credential (/credentials)." }
        enabled: { type: boolean, default: true }
        default: { type: boolean, default: false, description: "At most one Default=true integration per project." }
        export_pipelines: { type: boolean, default: true }
        export_notebook_executions: { type: boolean, default: false }
        experiment_template: { type: string }
        artifact_mode: { type: string, enum: [reference], default: reference }
    MlflowIntegrationDetail:
      allOf:
        - { $ref: "#/components/schemas/MlflowIntegration" }
        - type: object
          properties:
            system_enabled: { type: boolean, description: Whether the server-level MLflow dispatcher is enabled. }
            health: { type: string, enum: [healthy, degraded, disabled] }
            pending_events: { type: integer }
            dead_events: { type: integer }
            oldest_pending_age_seconds: { type: number }
    MlflowConnectionTestResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string, description: "Redacted — never includes the raw remote response body or any credential." }
    MlflowRunLink:
      type: object
      description: Sync status mapping a Piper pipeline run to an MLflow run (docs/mlflow-tracking-adapter.md section 6.2).
      required: [integration_id, sync_status]
      properties:
        integration_id: { type: string }
        mlflow_run_id: { type: string }
        mlflow_run_url: { type: string, format: uri, description: "Best-effort browser-facing MLflow UI link." }
        sync_status: { type: string, enum: [pending, syncing, synced, degraded, disabled] }
        last_error_code: { type: string }
        last_error_message: { type: string }
        last_synced_at: { type: string, format: date-time }
    AlertRule:
      type: object
      required: [id, project_id, name, on, notify, cooldown_seconds, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string }
        name: { type: string }
        on: { type: string, enum: [event, metric] }
        event_type: { type: string, enum: [run.completed, service.status, notebook.running, notebook.stopped, notebook.failed] }
        when: { type: string, description: 'Optional strict comparison such as fields.status == "failed".' }
        metric_key: { type: string }
        condition: { type: string, description: "Numeric comparison such as < 0.8." }
        notify: { type: array, minItems: 1, items: { type: string } }
        cooldown_seconds: { type: integer, minimum: 10 }
        enabled: { type: boolean }
        created_by: { type: string }
        last_matched_at: { type: string, format: date-time }
        last_attempted_at: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateAlertRuleRequest:
      type: object
      required: [name, on, notify]
      properties:
        name: { type: string }
        on: { type: string, enum: [event, metric] }
        event_type: { type: string }
        when: { type: string }
        metric_key: { type: string }
        condition: { type: string }
        notify: { type: array, minItems: 1, items: { type: string } }
        cooldown_seconds: { type: integer, minimum: 10 }
        enabled: { type: boolean, default: true }
    PatchAlertRuleRequest:
      type: object
      properties:
        name: { type: string }
        on: { type: string, enum: [event, metric] }
        event_type: { type: string }
        when: { type: string }
        metric_key: { type: string }
        condition: { type: string }
        notify: { type: array, minItems: 1, items: { type: string } }
        cooldown_seconds: { type: integer, minimum: 10 }
        enabled: { type: boolean }
    Run:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        schedule_id: { type: string }
        experiment: { type: string }
        pipeline_name: { type: string }
        pipeline_version: { type: integer, description: Template version the run was started from, when it came from a pipeline template. }
        status: { type: string, enum: [scheduled, running, success, failed, canceled] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        scheduled_at: { type: string, format: date-time }
        pipeline_yaml: { type: string }
        params_json: { type: string }
        created_by: { type: string }
    RunWithSteps:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            steps:
              type: array
              items: { $ref: "#/components/schemas/Step" }
    Step:
      type: object
      properties:
        run_id: { type: string }
        step_name: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        attempts: { type: integer }
        error: { type: string }
    Schedule:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        pipeline_yaml: { type: string }
        template_version_id: { type: string }
        schedule_type: { type: string, enum: [immediate, once, cron] }
        cron_expr: { type: string }
        enabled: { type: boolean }
        max_runs: { type: integer }
        params_json: { type: string }
        last_run_at: { type: string, format: date-time }
        next_run_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Service:
      type: object
      properties:
        project_id: { type: string }
        name: { type: string }
        run_id: { type: string }
        artifact: { type: string }
        status: { type: string, enum: [starting, running, stopping, stopped, failed] }
        endpoint: { type: string }
        namespace: { type: string }
        pid: { type: integer }
        runtime_id: { type: string }
        yaml: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PipelineTemplate:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        version: { type: integer }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        yaml: { type: string }
        snapshot_id: { type: string }
        volume_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotebookServer:
      type: object
      properties:
        project_id: { type: string }
        name: { type: string }
        status: { type: string, enum: [provisioning, starting, running, stopping, stopped, failed] }
        env: { type: string }
        image: { type: string }
        endpoint: { type: string }
        work_dir: { type: string }
        runtime_id: { type: string }
        volume_id: { type: string }
        yaml: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotebookContentEntry:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [directory, notebook, file] }
        size: { type: integer, format: int64 }
        last_modified: { type: string, format: date-time }
    NotebookDocument:
      type: object
      properties:
        content: { type: object, description: "Full .ipynb JSON document (nbformat v4)." }
        content_hash: { type: string, description: "sha256 hex digest of the document's canonical encoding." }
    KernelSession:
      type: object
      description: >-
        A Piper-owned Jupyter kernel session. Jupyter-native session/kernel
        IDs are never exposed — see docs/jupyter-mcp-execution.md §5.1.
      properties:
        id: { type: string }
        project_id: { type: string }
        notebook_name: { type: string }
        notebook_path: { type: string }
        kernel_name: { type: string }
        status: { type: string, enum: [starting, idle, busy, restarting, closed, failed] }
        created_by: { type: string }
        client_id: { type: string }
        last_activity_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
    NotebookExecutionEdit:
      type: object
      required: [mode, code]
      properties:
        mode: { type: string, enum: [append, replace] }
        code: { type: string }
        cell_id: { type: string, description: "Required when mode is replace." }
    NotebookExecutionRequest:
      type: object
      required: [kind, path]
      properties:
        kind: { type: string, enum: [notebook, cell] }
        path: { type: string, description: "Target .ipynb path." }
        kernel_session_id: { type: string, description: "Reuse an existing Piper kernel session; a new one is created when omitted." }
        edit: { $ref: "#/components/schemas/NotebookExecutionEdit" }
        create_if_missing: { type: boolean, description: "cell kind only — create path if it doesn't exist yet." }
        timeout_seconds: { type: integer }
    NotebookExecution:
      type: object
      description: >-
        See docs/jupyter-mcp-execution.md §5.2 for the full status state
        machine and §11.3 for the stable error_code values.
      properties:
        id: { type: string }
        project_id: { type: string }
        notebook_name: { type: string }
        notebook_path: { type: string }
        result_path: { type: string, description: ".piper/executions/{id}/result.ipynb — always written, even on conflict/failure." }
        kernel_session_id: { type: string }
        kind: { type: string, enum: [notebook, cell] }
        status:
          type: string
          enum: [awaiting_approval, queued, running, succeeded, conflicted, failed, timed_out, cancelling, cancelled]
        requested_by: { type: string }
        requested_by_username: { type: string, description: "Server-resolved display name for requested_by — present even when the viewer lacks system-admin access to GET /users." }
        client_id: { type: string }
        source_sha256: { type: string, description: "sha256 of the executed source — raw code is never stored." }
        base_content_hash: { type: string }
        current_cell: { type: integer }
        total_cells: { type: integer }
        error_code:
          type: string
          enum:
            - notebook_not_running
            - kernel_unavailable
            - kernel_died
            - execution_timeout
            - execution_cancelled
            - content_conflict
            - path_invalid
            - output_too_large
            - approval_required
            - approval_denied
            - runtime_unavailable
            - recovery_uncertain
        error_message: { type: string }
        output_summary: { type: object, description: "Capped structured status summary, not the full notebook output." }
        approved_by: { type: string }
        approved_by_username: { type: string, description: "Server-resolved display name for approved_by." }
        approved_at: { type: string, format: date-time }
        denied_by: { type: string }
        denied_by_username: { type: string, description: "Server-resolved display name for denied_by." }
        denied_at: { type: string, format: date-time }
        queued_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Viewer:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        type: { type: string }
        run_id: { type: string }
        step_name: { type: string }
        artifact: { type: string }
        status: { type: string, enum: [starting, running, failed, stopped] }
        endpoint: { type: string }
        url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    LogLine:
      type: object
      properties:
        id: { type: integer, format: int64 }
        event_id: { type: string }
        project_id: { type: string }
        run_id: { type: string }
        step_name: { type: string }
        ts: { type: string, format: date-time }
        stream: { type: string, enum: [stdout, stderr] }
        line: { type: string }
    StepArtifacts:
      type: object
      properties:
        step: { type: string }
        artifacts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              files:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    size: { type: integer, format: int64 }
                    modified_at: { type: string, format: date-time }
    ModelService:
      type: object
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        metadata:
          type: object
          properties:
            name: { type: string }
        spec:
          type: object
          properties:
            model:
              type: object
              properties:
                from_artifact:
                  type: object
                  properties:
                    pipeline: { type: string }
                    step: { type: string }
                    artifact: { type: string }
                    run: { type: string }
                from_uri:
                  type: string
                  description: file://, http://, https://, or s3:// model location.
