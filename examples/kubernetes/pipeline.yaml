# K8s execution example
#
# With runtime.type=k8s, the Piper server creates each step as a separate Job
# through the Kubernetes API. Each step can use a different container image.
#
# Server configuration (piper.yaml):
#   runtime:
#     type: k8s
#     namespaces: [piper]
#     in_cluster: true
#     workload_url: http://piper-server.piper.svc.cluster.local:8080
#
# Run:
#   piper server --config piper.yaml

apiVersion: piper/v1
kind: Pipeline

metadata:
  name: k8s-pipeline

spec:
  steps:
  - name: extract
    driver:
      k8s:
        image: python:3.12-slim  # This step runs with the Python image
        namespace: piper
    run:
      type: command
      command:
        - python3
        - -c
        - |
          import json, os
          data = [{"id": i, "value": i * 10} for i in range(5)]
          out = os.environ["PIPER_OUTPUT_DIR"]
          with open(f"{out}/data.json", "w") as f:
              json.dump(data, f)
          print(f"extracted {len(data)} records")
    outputs:
      - name: raw-data
        path: data.json

  - name: transform
    driver:
      k8s:
        image: alpine:3.20       # This step runs with Alpine
        namespace: piper
    run:
      type: command
      command:
        - sh
        - -c
        - |
          echo "transforming data..."
          cat $PIPER_INPUT_DIR/raw-data/data.json
    depends_on: [extract]
    inputs:
      - name: raw-data
        from: extract/raw-data
