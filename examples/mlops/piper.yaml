# Piper server configuration
# Pass with: piper --config examples/mlops/piper.yaml serve

version: 4

server:
  http_addr: :8080
  # This example is local-only. Production servers should set auth_signing_key.
  allow_insecure_trusted_mode: true
  allow_insecure_dev_key: true
  data_dir: ./piper-outputs
  retention:
    artifact_ttl: 168h  # delete S3 artifacts older than 7 days

storage:
  url: s3://piper-artifacts?endpoint=http://localhost:8333&s3ForcePathStyle=true&accessKey=piperadmin&secretKey=piperadmin
