apiVersion: piper/v1
kind: Pipeline

metadata:
  name: iris-experiment

spec:
  steps:
    # ── Step 1: train ──────────────────────────────────────────────────────────
    # Runs the iris_train.ipynb notebook via papermill.
    # Override params at submission time:
    #   POST /runs  {"yaml": "...", "params": {"n_estimators": 200}}
    - name: train
      run:
        path: examples/notebook/iris_train.ipynb
        # Notebook template, baremetal variant (see docs/pipeline-execution-templates.md).
        prepare:
          - [python3, -m, venv, .venv]
          - [.venv/bin/python, -m, pip, install, --quiet, papermill, ipykernel, scikit-learn]
          - [.venv/bin/python, -m, ipykernel, install, --prefix, .venv, --name, piper-step]
        command:
          - sh
          - -c
          - .venv/bin/papermill -k piper-step --log-output "$PIPER_SCRIPT_PATH" "$PIPER_OUTPUT_DIR/executed.ipynb" -f "$PIPER_PARAMS_FILE"
      params:
        n_estimators: 100
        test_size: 0.2
        random_state: 42
      outputs:
        - name: model
          path: model.pkl
        - name: metrics
          path: metrics.json
      options:
        env:
          # Papermill progress bars pollute logs; turn them off
          - name: PAPERMILL_PROGRESS_BAR
            value: "false"

    # ── Step 2: evaluate ────────────────────────────────────────────────────────
    # Reads metrics.json from the train step and prints a summary.
    # In a real pipeline this could run a heavier eval suite.
    - name: evaluate
      depends_on: [train]
      run:
        command:
          - sh
          - -c
          - |
            echo "=== Evaluation Summary ==="
            cat "$PIPER_INPUT_DIR/metrics/metrics.json"
      inputs:
        - name: metrics
          from: train/metrics
