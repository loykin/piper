apiVersion: piper/v1
kind: NotebookServer

metadata:
  name: my-notebook

spec:
  driver:
    # placement.runtime is optional here; docker is implied by the
    # driver.docker block. Set it only to make the target explicit.
    placement:
      runtime: docker

    # Docker Compose service format.
    docker:
      image: jupyter/scipy-notebook:latest
      cpus: "4"
      mem_limit: "8g"
      shm_size: "1g"

      # GPU access via Docker Compose deploy.resources (requires nvidia-container-toolkit).
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: "1"          # "all" to expose every GPU
                capabilities: [gpu]
