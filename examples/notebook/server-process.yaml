apiVersion: piper/v1
kind: NotebookServer

metadata:
  name: my-notebook

spec:
  driver:
    # placement.runtime is optional here; baremetal is implied by the
    # driver.process block. Set it only to make the target explicit.
    placement:
      runtime: baremetal

    process:
      # conda env name, venv path, or empty (auto-creates .venv in work dir)
      env: conda:ml-env

      # Comma-separated GPU indices passed as CUDA_VISIBLE_DEVICES.
      # "all" to expose every GPU, omit for CPU-only.
      gpus: "0,1"
