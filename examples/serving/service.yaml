apiVersion: piper/v1
kind: ModelService

metadata:
  name: iris-predictor

spec:
  model:
    # Pulls model.pkl from the most recent successful run of iris-retraining.
    # The serving worker downloads the artifact from S3 to a local directory
    # before starting the serving process.
    from_artifact:
      pipeline: iris-retraining
      step: train
      artifact: model
      run: latest

  run:
    command:
      - python3
      - examples/serving/serve.py
    port: 9080
    health_path: /health  # Piper polls this until 200 before marking service "running"

  # driver.placement.runtime defaults to whatever capability-matched worker is
  # available; this demo runs one worker with the serving capability (see setup.sh).
