apiVersion: piper/v1
kind: Pipeline
metadata:
  name: "iris"
spec:
  defaults:
    driver:
      placement:
        runtime: "baremetal"
  steps:
    - name: "task-1"
      run:
        path: "train_iris.ipynb"
        prepare:
          - ["sh", "-c", "python3 -m venv .venv"]
          - ["sh", "-c", ".venv/bin/python -m pip install -q papermill ipykernel"]
          - ["sh", "-c", ".venv/bin/python -m ipykernel install --prefix .venv --name piper-step"]
          - ["sh", "-c", ".venv/bin/python -m pip install -q -r requirements.txt"]
        command:
          - "sh"
          - "-c"
          - ".venv/bin/papermill -k piper-step --log-output \"$PIPER_SCRIPT_PATH\" \"$PIPER_OUTPUT_DIR/executed.ipynb\" -f \"$PIPER_PARAMS_FILE\""
        deps:
          - "requirements.txt"
      params:
        n_estimators: 120
      outputs:
        - name: "executed-notebook"
          path: "executed.ipynb"
